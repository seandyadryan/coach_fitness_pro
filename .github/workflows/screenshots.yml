name: Native emulator QA & store captures
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Android CI run to download the signed release from
        required: true
        type: string
      qa_mode:
        description: Focus on movement demos, or refresh all baseline screenshots too
        required: true
        default: movements
        type: choice
        options: [movements, full]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - name: Download signed build
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          pattern: coach-fitness-pro-release-*
          merge-multiple: true
          path: release-build
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download native character render checks
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          name: debug-apk-and-reports
          path: debug-build
      - name: Start Android and capture real app screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save
          script: |
            adb install "$(find debug-build -name app-debug.apk -print -quit)"
            adb install "$(find debug-build -name app-debug-androidTest.apk -print -quit)"
            adb shell am instrument -w com.deploydulupulangnanti.coachfitness.test/com.deploydulupulangnanti.coachfitness.CharacterRenderInstrumentation | tee character-render.txt
            mkdir -p store/character/native-checks
            adb pull /sdcard/Android/data/com.deploydulupulangnanti.coachfitness/files/character-qa/. store/character/native-checks/
            grep -q 'character_checks=PASS' character-render.txt
            adb uninstall com.deploydulupulangnanti.coachfitness.test
            adb uninstall com.deploydulupulangnanti.coachfitness
            adb install "$(find release-build -name app-release.apk -print -quit)"
            python tools/run_native_qa.py --mode ${{ inputs.qa_mode }}
      - name: Upload real screenshots, video and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-fitness-pro-store-captures
          path: |
            store/screenshots/
            store/video/
            store/qa-results.json
            store/asset-validation.json
            store/debug/
            store/animations/native-checks/
            store/animations/movement-demo.mp4
            store/movement-qa.json
            store/character/native-checks/
