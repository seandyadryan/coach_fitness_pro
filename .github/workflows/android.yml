name: Android CI & signed release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint and build debug APK
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
  release:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore upload signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing KEYSTORE_BASE64 repository secret'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/coach_fitness_pro.jks"
      - name: Build signed Play bundle and APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/coach_fitness_pro.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: bash ./gradlew bundleRelease assembleRelease lintRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: coach-fitness-pro-release-${{ github.run_number }}
          retention-days: 30
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/coach_fitness_pro.jks"
